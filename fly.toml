# fly.toml app configuration file generated for call-calendar-k7f2 on 2026-11-02T10:38:12+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'call-calendar-k7f2'
primary_region = 'fra'

[build]
dockerfile = 'Dockerfile'

[env]
DATABASE_PATH = '/data/calendar.sqlite'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '30s'
method = 'GET'
timeout = '5s'
path = '/api/health'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024

[mounts]
source = 'data'
destination = '/data'
