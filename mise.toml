[settings]
experimental = true

[tools]
node = "24.22.2"
pnpm = "10.19.0"
hk = "2.9.0"
pkl = "0.32.2"
pitchfork = "2.32.3"
jactionlint = "2.3.0"
shellcheck = "0.11.0"

[env]
NODE_ENV = "development"

[tasks.install]
description = "Install project dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.add]
description = "Add a dependency to a workspace project (default @calendar/web)"
usage = '''
arg "<packages>" var=#true
flag "--filter <project>" default="@calendar/web"
'''
run = '''
#!/usr/bin/env bash
eval "packages=(${usage_packages?})"
pnpm --filter "${usage_filter?}" add "${packages[@]}"
'''

[tasks.dev]
description = "Start API and web dev servers (pitchfork daemons)"
run = ["mise daemons start", "mise daemons ls"]

[tasks.install-hooks]
description = "Install shared Git hooks"
run = "hk install --mise"

[tasks.dev-api]
run = "pnpm --filter @calendar/api dev"

[tasks.dev-web]
run = "pnpm --filter @calendar/web dev"

[tasks.format]
run = "pnpm run format"

[tasks."format:check"]
run = "pnpm run format:check"

[tasks.lint]
run = "pnpm run lint"

[tasks.typecheck]
run = "pnpm run typecheck"

[tasks.test]
run = "pnpm run test"

[tasks.build]
run = "pnpm run build"

[tasks.generate]
description = "Regenerate OpenAPI spec and SDK from TypeSpec contract"
run = "pnpm run generate"

[tasks."check:generated"]
run = "pnpm run check:generated"

[tasks."db:generate"]
description = "Generate database migrations"
run = "pnpm run db:generate"

[tasks."db:migrate"]
description = "Apply database migrations"
run = "pnpm run db:migrate"

[tasks.check]
description = "Run the same checks locally and in CI"
run = [
  "pnpm run lint",
  "pnpm run format:check",
  "pnpm run typecheck",
  "pnpm run test",
  "pnpm run check:generated",
  "pnpm run build",
  "jactionlint .github/workflows/ci.yml",
]

[daemons.api]
run = "exec pnpm --filter @calendar/api dev"
ready_port = 3000

[daemons.web]
run = "exec pnpm --filter @calendar/web dev"
ready_port = 5173
