openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /api/meeting-types:
    get:
      operationId: MeetingTypes_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: MeetingTypes_create
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            etag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeInput'
  /api/meeting-types/{id}/availability:
    get:
      operationId: Availability_summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/meeting-types/{id}/slots:
    get:
      operationId: Availability_slots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotsResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    AvailabilityDay:
      type: object
      required:
        - date
        - availableCount
      properties:
        date:
          type: string
        availableCount:
          type: integer
          format: int32
    AvailabilityResponse:
      type: object
      required:
        - version
        - days
      properties:
        version:
          type: integer
          format: int32
        days:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityDay'
    MeetingType:
      type: object
      required:
        - id
        - version
      properties:
        id:
          type: string
        version:
          type: integer
          format: int32
      allOf:
        - $ref: '#/components/schemas/MeetingTypeInput'
    MeetingTypeInput:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 1000
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
        - available
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        available:
          type: boolean
    SlotsResponse:
      type: object
      required:
        - version
        - slots
      properties:
        version:
          type: integer
          format: int32
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
